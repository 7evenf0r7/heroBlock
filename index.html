<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>hero</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- шапка сайта -->
  <header class="header">
    <div class="container header_container">
      <a href="#" class="logo">
        <img src="img/logo.jpg" alt="logo">
      </a>
      
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item"><a href="#" class="nav_link">About us</a></li>
          <li class="nav_item"><a href="#" class="nav_link">Services</a></li>
          <li class="nav_item"><a href="#" class="nav_link">Use Cases</a></li>
          <li class="nav_item"><a href="#" class="nav_link">Pricing</a></li>
          <li class="nav_item"><a href="#" class="nav_link">Blog</a></li>
        </ul>
      </nav>

      <button class=" btn button_with_a_border">Request a quote</button>

    </div>
  </header>

  <!-- основной контент  -->
  <main>
    <section class="hero">
      <div class="container hero_container">
        
        <!-- левая часть -->
        <div class="hero_content">
          <h1 class="hero_title">Navigating the digital landscape for success</h1>
          <p class="hero_text">
            Our digital marketing agency helps businesses grow and succeed online through a range of services including SEO, PPC, social media marketing, and content creation.
          </p>
          <button class=" btn dark_button">Book a consultation</button>
        </div>

        <!--  картинка -->
        <div class="hero_image">
          <img src="img/images.jpg" alt="images" class="hero_image">
        </div>

      </div>

      <!-- логотипы партнеров -->
      <div class="container partners">
        <ul class="partners_list">
          <li class="partners_logo"><img src="img/amazon.jpg" alt="Amazon"></li>
          <li class="partners_logo"><img src="img/dribbble.jpg" alt="Dribbble"></li>
          <li class="partners_logo"><img src="img/hubspot.jpg" alt="HubSpot"></li>
          <li class="partners_logo"><img src="img/notion.jpg" alt="Notion"></li>
          <li class="partners_logo"><img src="img/netflix.jpg" alt="Netflix"></li>
          <li class="partners_logo"><img src="img/zoom.jpg" alt="Zoom"></li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
